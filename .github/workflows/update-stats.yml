name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch and process GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: node scripts/fetch-stats.mjs

      - name: Trigger Vercel Revalidation Webhook
        env:
          REVALIDATION_TOKEN: ${{ secrets.REVALIDATION_TOKEN }}
        run: |
          curl -X POST "https://anshu-nandi.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATION_TOKEN" \
            -H "Content-Type: application/json"
